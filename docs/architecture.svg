<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #d0d0d4; stroke-width: 1.4; rx: 10; }
      .box-soft { fill: #f7f7f9; stroke: #dcdce1; stroke-width: 1.2; rx: 10; }
      .box-accent { fill: #eef4ff; stroke: #9dbcf0; stroke-width: 1.4; rx: 10; }
      .t { fill: #1f2328; font-size: 14px; }
      .s { fill: #6b7280; font-size: 12px; }
      .h { fill: #1f2328; font-size: 15px; font-weight: 600; }
      .l { stroke: #8a8a8a; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
      .ln { stroke: #c9c9cf; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <rect width="980" height="620" fill="#fbfbfc"/>

  <!-- 左：采集 -->
  <rect class="box" x="24" y="28" width="210" height="96"/>
  <text class="h" x="40" y="56">会话日志</text>
  <text class="s" x="40" y="78">DSH / zcode / hermes / workbuddy</text>
  <text class="s" x="40" y="98">仅追加，压缩只遮蔽 surface</text>

  <rect class="box" x="24" y="156" width="210" height="112"/>
  <text class="h" x="40" y="184">钩子（指针）</text>
  <text class="s" x="40" y="206">session + seq 区间</text>
  <text class="s" x="40" y="226">origin：人提的 / 代理自产</text>
  <text class="s" x="40" y="246">topic · topicFine · segment</text>

  <!-- 中：归纳 -->
  <rect class="box-accent" x="286" y="28" width="250" height="240"/>
  <text class="h" x="302" y="56">两遍读归纳</text>
  <text class="s" x="302" y="80">① 第一遍：一条一条读，边读边长表</text>
  <text class="s" x="302" y="100">② 合并：其实是同一件事的合成一条</text>
  <text class="s" x="302" y="120">③ 宽类：细线收成 12 个方向</text>
  <text class="s" x="302" y="140">④ 第二遍：定稿表重读，逐条落位</text>
  <line class="ln" x1="302" y1="156" x2="520" y2="156"/>
  <text class="s" x="302" y="180">主题表：12 宽类 + 81 细类</text>
  <text class="s" x="302" y="200">每条带可编辑「评述」</text>
  <text class="s" x="302" y="220">两遍一致率：细 68.4% / 宽 83.6%</text>
  <text class="s" x="302" y="240">未归类 3.8%</text>

  <!-- 中下：归类 -->
  <rect class="box" x="286" y="300" width="250" height="170"/>
  <text class="h" x="302" y="328">按段归类</text>
  <text class="s" x="302" y="352">切段：同一件事的连续推进算一段</text>
  <text class="s" x="302" y="372">归类：整段对定稿表落位</text>
  <text class="s" x="302" y="392">回填：段主题写到段内每条钩子</text>
  <text class="s" x="302" y="412">固化：segments.jsonl + segLabel</text>
  <text class="s" x="302" y="436">41 个多钩子会话 → 211 段</text>

  <!-- 右：召回 -->
  <rect class="box" x="586" y="28" width="370" height="196"/>
  <text class="h" x="602" y="56">分级召回</text>
  <text class="s" x="602" y="82">L1　12 条宽类评述（~1.3k 字符）</text>
  <text class="s" x="602" y="104">L2　选中宽类下的细类评述</text>
  <text class="s" x="602" y="126">L3　选中细类下的单元（日期 + 这段在做什么）</text>
  <line class="ln" x1="602" y1="142" x2="940" y2="142"/>
  <text class="s" x="602" y="164">合计 ~2.6k 字符 / 4.5 秒</text>
  <text class="s" x="602" y="184">平铺 421 个单元：27k 字符</text>
  <text class="s" x="602" y="204">关键词兜底：80 题命中率 8.8%</text>

  <rect class="box-soft" x="586" y="252" width="370" height="92"/>
  <text class="h" x="602" y="278">当前方向（pin）</text>
  <text class="s" x="602" y="300">面板选一个标签 → 召回按它注入</text>
  <text class="s" x="602" y="320">新写入的记忆也归到这条线（默认 8h）</text>

  <rect class="box" x="586" y="376" width="370" height="94"/>
  <text class="h" x="602" y="402">面板</text>
  <text class="s" x="602" y="424">宽类方块 → 细线清单 → 星图（会话/钩子）</text>
  <text class="s" x="602" y="444">来源过滤 · 会话按段分组 · 新开模块</text>

  <!-- 连线 -->
  <line class="l" x1="234" y1="76" x2="282" y2="76"/>
  <line class="l" x1="234" y1="212" x2="282" y2="80"/>
  <line class="l" x1="129" y1="268" x2="129" y2="300"/>
  <text class="s" x="140" y="288">原文按 seq 回放</text>
  <line class="l" x1="411" y1="268" x2="411" y2="296"/>
  <line class="l" x1="536" y1="180" x2="582" y2="180"/>
  <line class="l" x1="536" y1="380" x2="582" y2="380"/>
  <line class="ln" x1="582" y1="298" x2="536" y2="298" stroke-dasharray="4 3"/>
  <line class="ln" x1="582" y1="298" x2="582" y2="380" stroke-dasharray="4 3"/>

  <text class="s" x="24" y="588">数据都在本机：hooks.jsonl · topics.json · segments.jsonl · pins.json</text>
  <text class="s" x="24" y="608">dsh-work-memory v0.2</text>
</svg>
